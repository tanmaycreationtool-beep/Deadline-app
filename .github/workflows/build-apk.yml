name: Build Deadline APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle-8.10.2-bin.zip
          echo "$PWD/gradle-8.10.2/bin" >> $GITHUB_PATH

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/deadline/app
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          cp index.html app/src/main/assets/index.html
          cp icon.png app/src/main/res/drawable/icon.png

      - name: Create settings.gradle
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Deadline"
          include(":app")
          EOF

      - name: Create root build.gradle
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

      - name: Create gradle.properties
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      - name: Create app build.gradle
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.deadline.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.deadline.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

      - name: Create AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />

              <application
                  android:allowBackup="true"
                  android:label="Deadline"
                  android:icon="@drawable/icon"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <receiver
                      android:name=".ReminderReceiver"
                      android:exported="false" />

                  <receiver
                      android:name=".BootReceiver"
                      android:enabled="true"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>

                  </receiver>

              </application>

          </manifest>
          EOF

      - name: Create styles.xml
        run: |
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:windowBackground">#000000</item>
              </style>

          </resources>
          EOF

      - name: Create notification icon
        run: |
          cat > app/src/main/res/drawable/ic_notification.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">

              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M12,22a2.5,2.5 0,0 0,2.45 -2h-4.9A2.5,2.5 0,0 0,12 22zM18,16v-5c0,-3.07 -1.63,-5.64 -4.5,-6.32V4a1.5,1.5 0,0 0,-3 0v0.68C7.63,5.36 6,7.93 6,11v5l-2,2v1h16v-1z" />

          </vector>
          EOF

      - name: Create MainActivity.java
        run: |
          cat > app/src/main/java/com/deadline/app/MainActivity.java <<'EOF'
          package com.deadline.app;

          import android.Manifest;
          import android.app.Activity;
          import android.os.Bundle;
          import android.os.Build;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.view.KeyEvent;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  NotificationHelper.createChannel(this);

                  webView = new WebView(this);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient());

                  webView.addJavascriptInterface(
                          new AndroidBridge(this),
                          "AndroidBridge"
                  );

                  setContentView(webView);

                  webView.loadUrl("file:///android_asset/index.html");

                  ReminderScheduler.scheduleNext(this);
              }

              public class AndroidBridge {

                  private final Context context;

                  AndroidBridge(Context context) {
                      this.context = context;
                  }

                  @JavascriptInterface
                  public void syncGoals(String goalsJson) {
                      getSharedPreferences("DeadlineData", MODE_PRIVATE)
                              .edit()
                              .putString("goals", goalsJson)
                              .apply();

                      ReminderScheduler.scheduleNext(context);
                  }

                  @JavascriptInterface
                  public void requestNotificationPermission() {

                      if (Build.VERSION.SDK_INT >= 33 &&
                              checkSelfPermission(
                                      Manifest.permission.POST_NOTIFICATIONS
                              ) != PackageManager.PERMISSION_GRANTED) {

                          runOnUiThread(() ->
                                  requestPermissions(
                                          new String[]{
                                                  Manifest.permission.POST_NOTIFICATIONS
                                          },
                                          1001
                                  )
                          );
                      }
                  }
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {

                  if (keyCode == KeyEvent.KEYCODE_BACK &&
                          webView != null &&
                          webView.canGoBack()) {

                      webView.goBack();
                      return true;
                  }

                  return super.onKeyDown(keyCode, event);
              }
          }
          EOF

      - name: Create NotificationHelper.java
        run: |
          cat > app/src/main/java/com/deadline/app/NotificationHelper.java <<'EOF'
          package com.deadline.app;

          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.content.Context;
          import android.os.Build;

          public class NotificationHelper {

              public static final String CHANNEL_ID = "deadline_reminders";

              public static void createChannel(Context context) {

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {

                      NotificationChannel channel =
                              new NotificationChannel(
                                      CHANNEL_ID,
                                      "Deadline Reminders",
                                      NotificationManager.IMPORTANCE_DEFAULT
                              );

                      channel.setDescription(
                              "Daily reminders for your deadlines"
                      );

                      NotificationManager manager =
                              context.getSystemService(
                                      NotificationManager.class
                              );

                      if (manager != null) {
                          manager.createNotificationChannel(channel);
                      }
                  }
              }
          }
          EOF

      - name: Create ReminderScheduler.java
        run: |
          cat > app/src/main/java/com/deadline/app/ReminderScheduler.java <<'EOF'
          package com.deadline.app;

          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;

          import java.util.Calendar;

          public class ReminderScheduler {

              private static final int REQUEST_CODE = 7001;

              public static void scheduleNext(Context context) {

                  AlarmManager alarmManager =
                          (AlarmManager) context.getSystemService(
                                  Context.ALARM_SERVICE
                          );

                  if (alarmManager == null) {
                      return;
                  }

                  Intent intent =
                          new Intent(context, ReminderReceiver.class);

                  PendingIntent pendingIntent =
                          PendingIntent.getBroadcast(
                                  context,
                                  REQUEST_CODE,
                                  intent,
                                  PendingIntent.FLAG_UPDATE_CURRENT |
                                          PendingIntent.FLAG_IMMUTABLE
                          );

                  Calendar calendar = Calendar.getInstance();

                  calendar.set(Calendar.HOUR_OF_DAY, 0);
                  calendar.set(Calendar.MINUTE, 0);
                  calendar.set(Calendar.SECOND, 0);
                  calendar.set(Calendar.MILLISECOND, 0);

                  calendar.add(Calendar.DAY_OF_YEAR, 1);

                  long triggerTime = calendar.getTimeInMillis();

                  if (android.os.Build.VERSION.SDK_INT >= 23) {

                      alarmManager.setAndAllowWhileIdle(
                              AlarmManager.RTC_WAKEUP,
                              triggerTime,
                              pendingIntent
                      );

                  } else {

                      alarmManager.set(
                              AlarmManager.RTC_WAKEUP,
                              triggerTime,
                              pendingIntent
                      );
                  }
              }
          }
          EOF

      - name: Create ReminderReceiver.java
        run: |
          cat > app/src/main/java/com/deadline/app/ReminderReceiver.java <<'EOF'
          package com.deadline.app;

          import android.app.Notification;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.text.SimpleDateFormat;
          import java.util.Calendar;
          import java.util.Date;
          import java.util.Locale;
          import java.util.concurrent.TimeUnit;

          public class ReminderReceiver extends BroadcastReceiver {

              @Override
              public void onReceive(Context context, Intent intent) {

                  NotificationHelper.createChannel(context);

                  String goalsJson =
                          context.getSharedPreferences(
                                  "DeadlineData",
                                  Context.MODE_PRIVATE
                          ).getString("goals", "[]");

                  try {

                      JSONArray goals = new JSONArray(goalsJson);

                      NotificationManager manager =
                              (NotificationManager)
                                      context.getSystemService(
                                              Context.NOTIFICATION_SERVICE
                                      );

                      if (manager == null) {
                          return;
                      }

                      for (int i = 0; i < goals.length(); i++) {

                          JSONObject goal = goals.getJSONObject(i);

                          String name =
                                  goal.optString(
                                          "name",
                                          "Your goal"
                                  );

                          String dateString =
                                  goal.optString(
                                          "date",
                                          ""
                                  );

                          if (dateString.isEmpty()) {
                              continue;
                          }

                          SimpleDateFormat format =
                                  new SimpleDateFormat(
                                          "yyyy-MM-dd",
                                          Locale.US
                                  );

                          Date deadline =
                                  format.parse(dateString);

                          if (deadline == null) {
                              continue;
                          }

                          Calendar deadlineCalendar =
                                  Calendar.getInstance();

                          deadlineCalendar.setTime(deadline);

                          deadlineCalendar.set(
                                  Calendar.HOUR_OF_DAY,
                                  23
                          );
                          deadlineCalendar.set(
                                  Calendar.MINUTE,
                                  59
                          );
                          deadlineCalendar.set(
                                  Calendar.SECOND,
                                  59
                          );

                          Calendar now =
                                  Calendar.getInstance();

                          long difference =
                                  deadlineCalendar.getTimeInMillis()
                                          - now.getTimeInMillis();

                          long days =
                                  TimeUnit.MILLISECONDS.toDays(
                                          difference
                                  );

                          if (days < 0) {
                              continue;
                          }

                          String message;

                          if (days == 0) {

                              message =
                                      name +
                                      " — Your deadline is today.";

                          } else if (days <= 7) {

                              message =
                                      name +
                                      " — " +
                                      days +
                                      " days left. Stay focused.";

                          } else {

                              message =
                                      name +
                                      " — " +
                                      days +
                                      " days remaining.";
                          }

                          Intent openApp =
                                  new Intent(
                                          context,
                                          MainActivity.class
                                  );

                          PendingIntent pendingIntent =
                                  PendingIntent.getActivity(
                                          context,
                                          i,
                                          openApp,
                                          PendingIntent.FLAG_UPDATE_CURRENT |
                                                  PendingIntent.FLAG_IMMUTABLE
                                  );

                          Notification.Builder builder;

                          if (Build.VERSION.SDK_INT >= 26) {

                              builder =
                                      new Notification.Builder(
                                              context,
                                              NotificationHelper.CHANNEL_ID
                                      );

                          } else {

                              builder =
                                      new Notification.Builder(context)
                                              .setPriority(
                                                      Notification.PRIORITY_DEFAULT
                                              );
                          }

                          builder
                                  .setSmallIcon(
                                          com.deadline.app.R.drawable.ic_notification
                                  )
                                  .setContentTitle(
                                          "Deadline"
                                  )
                                  .setContentText(
                                          message
                                                - name: Create BootReceiver.java
                                                run: |
          cat > app/src/main/java/com/deadline/app/BootReceiver.java <<'EOF'
          package com.deadline.app;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          public class BootReceiver extends BroadcastReceiver {

              @Override
              public void onReceive(Context context, Intent intent) {

                  if (Intent.ACTION_BOOT_COMPLETED.equals(
                          intent.getAction()
                  )) {

                      ReminderScheduler.scheduleNext(context);
                  }
              }
          }
          EOF

      - name: Build APK
        run: |
          gradle assembleDebug

      - name: Check APK
        run: |
          echo "APK files:"
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Deadline-APK
          path: app/build/outputs/apk/debug/app-debug.apk
         
