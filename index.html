<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               viewport-fit=cover">

<meta name="theme-color" content="#050505">

<title>Deadline</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#050505;
    color:#f5f5f5;
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}

body{
    min-height:100dvh;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    width:280px;
    height:280px;
    top:-150px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(255,255,255,.055);
    filter:blur(80px);
    border-radius:50%;
    pointer-events:none;
}

button,input{
    font-family:inherit;
}

button{
    border:0;
    outline:0;
    cursor:pointer;
}

.app{
    width:100%;
    min-height:100dvh;
    padding:
        max(25px,env(safe-area-inset-top))
        18px
        max(28px,env(safe-area-inset-bottom))
        18px;
}

.container{
    width:min(100%,500px);
    margin:auto;
}

.screen{
    display:none;
}

.screen.active{
    display:block;
}

/* HEADER */

.header{
    padding-top:8px;
    margin-bottom:34px;
}

.logo{
    font-size:31px;
    font-weight:750;
    letter-spacing:-1.7px;
    text-shadow:0 0 18px rgba(255,255,255,.16);
}

.subtitle{
    margin-top:7px;
    color:#666;
    font-size:13px;
}

/* NEW GOAL */

.new-goal-btn{
    position:relative;
    width:100%;
    min-height:60px;
    border-radius:19px;
    background:linear-gradient(145deg,#fff,#dcdcdc);
    color:#050505;
    font-size:15px;
    font-weight:650;
    margin-bottom:34px;

    box-shadow:
        0 0 0 1px rgba(255,255,255,.15),
        0 8px 35px rgba(255,255,255,.07);

    transition:
        transform:.15s ease,
        box-shadow:.15s ease;
}

.new-goal-btn:active{
    transform:scale(.975);
}

/* SECTION */

.section-title{
    color:#555;
    font-size:10px;
    font-weight:700;
    letter-spacing:2px;
    text-transform:uppercase;
    margin-bottom:13px;
}

/* GOALS */

.goals{
    display:flex;
    flex-direction:column;
    gap:11px;
}

.goal-card{
    position:relative;
    width:100%;

    background:
        linear-gradient(
            145deg,
            #111,
            #0b0b0b
        );

    border:1px solid #1d1d1d;
    border-radius:21px;

    padding:19px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:15px;
    overflow:hidden;

    text-align:left;

    transition:
        transform:.15s ease,
        border-color:.15s ease;
}

.goal-card:active{
    transform:scale(.985);
    border-color:#333;
}

.goal-info{
    min-width:0;
    flex:1;
}

.goal-name{
    font-size:16px;
    font-weight:600;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.goal-date{
    color:#666;
    font-size:12px;
    margin-top:7px;
}

.goal-days{
    min-width:65px;
    text-align:right;
    color:#666;
    font-size:11px;
}

.goal-days strong{
    display:block;
    color:#eee;
    font-size:20px;
    font-weight:650;
    line-height:1;
}

.completed .goal-name{
    color:#555;
    text-decoration:line-through;
}

.completed .goal-days strong{
    color:#444;
}

/* EMPTY */

.empty{
    text-align:center;
    padding:48px 20px;
    color:#444;
    font-size:13px;
    line-height:1.7;
}

/* DETAIL */

.back-btn{
    background:transparent;
    color:#666;
    font-size:13px;
    padding:7px 0;
    margin-bottom:27px;
}

.back-btn:active{
    color:#aaa;
}

.detail-name{
    font-size:clamp(29px,8vw,43px);
    line-height:1.03;
    font-weight:700;
    letter-spacing:-1.8px;
    margin-bottom:10px;
    word-break:break-word;

    text-shadow:
        0 0 25px rgba(255,255,255,.08);
}

.detail-date{
    color:#666;
    font-size:13px;
    margin-bottom:38px;
}

/* COUNTDOWN */

.countdown{
    position:relative;
    text-align:center;

    padding:42px 10px 38px;

    background:
        radial-gradient(
            circle at center,
            #171717 0%,
            #0d0d0d 55%,
            #090909 100%
        );

    border:1px solid #202020;
    border-radius:29px;

    margin-bottom:11px;

    overflow:hidden;
}

.days-number{
    position:relative;

    font-size:clamp(
        72px,
        22vw,
        115px
    );

    font-weight:750;
    line-height:.86;
    letter-spacing:-6px;

    color:#f7f7f7;

    text-shadow:
        0 0 12px rgba(255,255,255,.13),
        0 0 35px rgba(255,255,255,.06);
}

.days-label{
    position:relative;
    color:#666;
    font-size:12px;
    margin-top:16px;
    letter-spacing:.5px;
}

/* TIME */

.time-row{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:22px;
}

.time-box{
    background:#0d0d0d;
    border:1px solid #1b1b1b;
    border-radius:17px;
    text-align:center;
    padding:15px 5px;
}

.time-number{
    font-size:21px;
    font-weight:600;
    color:#ddd;
}

.time-label{
    color:#4f4f4f;
    font-size:9px;
    margin-top:6px;
    letter-spacing:1px;
}

/* PROGRESS */

.progress-section{
    margin-bottom:27px;
}

.progress-top{
    display:flex;
    justify-content:space-between;
    color:#555;
    font-size:10px;
    margin-bottom:9px;
    letter-spacing:.4px;
}

.progress-track{
    width:100%;
    height:4px;
    border-radius:10px;
    background:#1c1c1c;
    overflow:hidden;
}

.progress-bar{
    width:0%;
    height:100%;
    background:#eee;
    border-radius:10px;

    box-shadow:
        0 0 10px rgba(255,255,255,.55),
        0 0 22px rgba(255,255,255,.2);

    transition:width .5s ease;
}

/* MOTIVATION */

.motivation{
    text-align:center;
    color:#666;
    font-size:13px;
    margin-bottom:27px;
}

/* ACTIONS */

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
}

.action-btn{
    min-height:51px;
    border-radius:16px;

    background:#111;
    color:#aaa;

    border:1px solid #202020;

    font-size:13px;
}

.action-btn:active{
    background:#181818;
    border-color:#333;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    z-index:1000;

    background:rgba(0,0,0,.84);

    display:none;

    align-items:center;
    justify-content:center;

    padding:16px;

    overflow-y:auto;

    -webkit-overflow-scrolling:touch;
}

.modal.show{
    display:flex;
}

.modal-box{
    position:relative;

    width:min(100%,430px);

    background:
        linear-gradient(
            145deg,
            #181818,
            #101010
        );

    border:1px solid #292929;
    border-radius:27px;

    padding:24px;

    max-height:90dvh;

    overflow-y:auto;

    -webkit-overflow-scrolling:touch;

    margin:auto;

    box-shadow:
        0 25px 80px rgba(0,0,0,.65),
        0 0 40px rgba(255,255,255,.025);
}

.modal-title{
    position:relative;
    font-size:22px;
    font-weight:650;
    margin-bottom:23px;
    letter-spacing:-.5px;
}

.field{
    margin-bottom:17px;
}

.field label{
    display:block;
    color:#666;
    font-size:10px;
    margin-bottom:8px;
    letter-spacing:1px;
    text-transform:uppercase;
}

.field input{
    width:100%;
    height:55px;

    border-radius:16px;

    border:1px solid #292929;
    outline:none;

    background:#0b0b0b;
    color:#f1f1f1;

    padding:0 15px;

    font-size:16px;

    -webkit-appearance:none;

    transition:
        border-color .2s ease,
        box-shadow .2s ease;
}

.field input::placeholder{
    color:#444;
}

.field input:focus{
    border-color:#555;

    box-shadow:
        0 0 0 3px
        rgba(255,255,255,.04);
}

.modal-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
    margin-top:8px;
}

.modal-btn{
    min-height:52px;

    border-radius:16px;

    background:#111;
    color:#aaa;

    border:1px solid #252525;

    font-size:13px;
}

.modal-btn.primary{
    background:#f1f1f1;
    color:#050505;
    font-weight:650;
}

.modal-btn:active{
    transform:scale(.98);
}

/* TOAST */

.toast{
    position:fixed;

    left:50%;
    bottom:25px;

    transform:
        translateX(-50%)
        translateY(20px);

    background:#eee;
    color:#050505;

    padding:12px 17px;

    border-radius:14px;

    font-size:12px;

    opacity:0;

    pointer-events:none;

    transition:.2s;

    z-index:2000;
}

.toast.show{
    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}
</style>
</head>

<body>

<div class="app">

<div class="container">

<!-- HOME -->

<section id="home" class="screen active">

    <div class="header">

        <div class="logo">
            Deadline
        </div>

        <div class="subtitle">
            Make your time count.
        </div>

    </div>


    <button
        id="newBtn"
        class="new-goal-btn"
        type="button">

        + Create a new goal

    </button>


    <div class="section-title">
        Your goals
    </div>


    <div
        id="goals"
        class="goals">
    </div>

</section>


<!-- DETAIL -->

<section id="detail" class="screen">

    <button
        id="backBtn"
        class="back-btn"
        type="button">

        ← Back

    </button>


    <div
        id="detailName"
        class="detail-name">
    </div>


    <div
        id="detailDate"
        class="detail-date">
    </div>


    <div class="countdown">

        <div
            id="daysNumber"
            class="days-number">

            0

        </div>

        <div
            id="daysLabel"
            class="days-label">

            days remaining

        </div>

    </div>


    <div class="time-row">

        <div class="time-box">

            <div
                id="hours"
                class="time-number">

                0

            </div>

            <div class="time-label">
                HOURS
            </div>

        </div>


        <div class="time-box">

            <div
                id="minutes"
                class="time-number">

                0

            </div>

            <div class="time-label">
                MINUTES
            </div>

        </div>


        <div class="time-box">

            <div
                id="seconds"
                class="time-number">

                0

            </div>

            <div class="time-label">
                SECONDS
            </div>

        </div>

    </div>


    <div class="progress-section">

        <div class="progress-top">

            <span>
                TIME ELAPSED
            </span>

            <span id="progressText">
                0%
            </span>

        </div>


        <div class="progress-track">

            <div
                id="progressBar"
                class="progress-bar">
            </div>

        </div>

    </div>


    <div
        id="motivation"
        class="motivation">

        Make today count.

    </div>


    <div class="actions">

        <button
            id="editBtn"
            class="action-btn"
            type="button">

            Edit

        </button>


        <button
            id="deleteBtn"
            class="action-btn"
            type="button">

            Delete

        </button>

    </div>

</section>

</div>

</div>


<!-- MODAL -->

<div
    id="modal"
    class="modal">

    <div class="modal-box">

        <div
            id="modalTitle"
            class="modal-title">

            New Goal

        </div>


        <div class="field">

            <label for="goalInput">
                Goal
            </label>

            <input
                id="goalInput"
                type="text"
                maxlength="100"
                autocomplete="off"
                placeholder="What do you want to achieve?">

        </div>


        <div class="field">

            <label for="dateInput">
                Deadline
            </label>

            <input
                id="dateInput"
                type="date">

        </div>


        <div class="modal-actions">

            <button
                id="cancelBtn"
                class="modal-btn"
                type="button">

                Cancel

            </button>


            <button
                id="saveBtn"
                class="modal-btn primary"
                type="button">

                Save Goal

            </button>

        </div>

    </div>

</div>


<div
    id="toast"
    class="toast">
</div>


<script>

(function(){

"use strict";


/* =========================
   BASIC VARIABLES
========================= */

const $ = id => document.getElementById(id);

const STORAGE_KEY = "deadlineGoals";

let goals = [];

let currentId = null;

let editingId = null;

let countdownTimer = null;


/* =========================
   LOAD DATA
========================= */

function loadGoals(){

    try{

        const saved =
            localStorage.getItem(STORAGE_KEY);

        goals =
            saved
                ? JSON.parse(saved)
                : [];

        if(!Array.isArray(goals)){
            goals = [];
        }

    }catch(error){

        console.error(error);

        goals = [];

    }

    renderGoals();

    syncGoalsWithAndroid();

}


/* =========================
   SAVE DATA
========================= */

function saveGoals(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(goals)
    );

    syncGoalsWithAndroid();

}


/* =========================
   ANDROID BRIDGE
========================= */

function syncGoalsWithAndroid(){

    try{

        if(
            window.AndroidBridge &&
            typeof AndroidBridge.syncGoals === "function"
        ){

            AndroidBridge.syncGoals(
                JSON.stringify(goals)
            );

        }

    }catch(error){

        console.log(
            "Android bridge unavailable."
        );

    }

}


/* =========================
   NOTIFICATION PERMISSION
========================= */

function requestAndroidNotifications(){

    try{

        if(
            window.AndroidBridge &&
            typeof AndroidBridge.requestNotificationPermission === "function"
        ){

            AndroidBridge.requestNotificationPermission();

        }

    }catch(error){

        console.log(
            "Notification bridge unavailable."
        );

    }

}


/* =========================
   DAYS LEFT
========================= */

function getDaysLeft(dateString){

    const target =
        new Date(
            dateString + "T23:59:59"
        );

    return Math.ceil(
        (target.getTime() - Date.now())
        / 86400000
    );

}


/* =========================
   FORMAT DATE
========================= */

function formatDate(dateString){

    return new Date(
        dateString + "T12:00:00"
    ).toLocaleDateString(
        undefined,
        {
            day:"numeric",
            month:"long",
            year:"numeric"
        }
    );

}


/* =========================
   RENDER GOALS
========================= */

function renderGoals(){

    const container =
        $("goals");

    container.innerHTML = "";


    if(goals.length === 0){

        container.innerHTML = `
            <div class="empty">
                No goals yet.<br>
                Create one and start counting.
            </div>
        `;

        return;
    }


    const sortedGoals =
        goals
            .slice()
            .sort(
                (a,b) =>
                    a.date.localeCompare(b.date)
            );


    sortedGoals.forEach(goal => {

        const days =
            getDaysLeft(goal.date);


        const card =
            document.createElement("button");


        card.type = "button";

        card.className =
            "goal-card" +
            (days <= 0
                ? " completed"
                : "");


        card.innerHTML = `

            <div class="goal-info">

                <div class="goal-name"></div>

                <div class="goal-date"></div>

            </div>


            <div class="goal-days">

                <strong></strong>

                ${days <= 0
                    ? "completed"
                    : "days"}

            </div>

        `;


        card.querySelector(
            ".goal-name"
        ).textContent =
            goal.name;


        card.querySelector(
            ".goal-date"
        ).textContent =
            formatDate(goal.date);


        card.querySelector(
            "strong"
        ).textContent =
            days <= 0
                ? "✓"
                : days;


        card.addEventListener(
            "click",
            function(){

                openDetail(goal.id);

            }
        );


        container.appendChild(card);

    });

}


/* =========================
   SCREEN CONTROL
========================= */

function showScreen(screenId){

    document
        .querySelectorAll(".screen")
        .forEach(screen => {

            screen.classList.remove(
                "active"
            );

        });


    $(screenId).classList.add(
        "active"
    );


    window.scrollTo(
        0,
        0
    );

}


/* =========================
   OPEN DETAIL
========================= */

function openDetail(id){

    currentId = id;

    showScreen("detail");

    updateDetail();


    clearInterval(
        countdownTimer
    );


    countdownTimer =
        setInterval(
            updateDetail,
            1000
        );

}


/* =========================
   UPDATE DETAIL
========================= */

function updateDetail(){

    const goal =
        goals.find(
            item =>
                item.id === currentId
        );


    if(!goal){

        clearInterval(
            countdownTimer
        );

        showScreen("home");

        renderGoals();

        return;

    }


    $("detailName").textContent =
        goal.name;


    $("detailDate").textContent =
        "Deadline · " +
        formatDate(goal.date);


    const target =
        new Date(
            goal.date +
            "T23:59:59"
        );


    let milliseconds =
        target.getTime()
        - Date.now();


    if(milliseconds < 0){

        milliseconds = 0;

    }


    const created =
        new Date(
            goal.createdAt
        ).getTime();


    const total =
        Math.max(
            1,
            target.getTime() - created
        );


    const elapsed =
        Math.max(
            0,
            Date.now() - created
        );


    const progress =
        Math.min(
            100,
            Math.max(
                0,
                elapsed / total * 100
            )
        );


    const days =
        Math.floor(
            milliseconds / 86400000
        );


    const hours =
        Math.floor(
            (milliseconds % 86400000)
            / 3600000
        );


    const minutes =
        Math.floor(
            (milliseconds % 3600000)
            / 60000
        );


    const seconds =
        Math.floor(
            (milliseconds % 60000)
            / 1000
        );


    $("daysNumber").textContent =
        days;


    $("daysLabel").textContent =
        days === 1
            ? "day remaining"
            : "days remaining";


    $("hours").textContent =
        hours;


    $("minutes").textContent =
        minutes;


    $("seconds").textContent =
        seconds;


    $("progressBar").style.width =
        progress + "%";


    $("progressText").textContent =
        Math.round(progress) + "%";


    if(milliseconds <= 0){

        $("motivation").textContent =
            "Your deadline has arrived.";

    }
    else if(days <= 7){

        $("motivation").textContent =
            "Stay focused. The finish line is close.";

    }
    else{
